<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
// Image switcher: webp <-> png toggle via event delegation on document
// This works regardless of when the script loads or whether DOM is already ready
(function() {
  document.addEventListener('click', function(e) {
    var switcher = e.target.closest('.img-switcher');
    if (!switcher) return;
    switcher.classList.toggle('is-showing-png');
    var hint = switcher.querySelector('.img-switcher__hint');
    if (hint) {
      hint.textContent = switcher.classList.contains('is-showing-png')
        ? 'Tap for animation'
        : 'Tap to toggle';
    }
  });
})();
</script>
